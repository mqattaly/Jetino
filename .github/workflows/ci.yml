name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # pull-requests: write lets a failing run paste the test output onto the PR,
    # because the raw job log is not reachable from outside GitHub Actions
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jetino
          POSTGRES_USER: jetino
          POSTGRES_PASSWORD: jetino_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetino -d jetino"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jetino:jetino_ci_only@localhost:5432/jetino?schema=public
      DATABASE_URL_TEST: postgresql://jetino:jetino_ci_only@localhost:5432/jetino?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install storefront dependencies
        run: npm ci
      - name: Build storefront
        run: npm run build
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Build API
        working-directory: api
        run: npm run build
      - name: Apply migrations
        working-directory: api
        run: npm run db:migrate
      - name: Run API tests (unit plus the PostgreSQL flow test)
        working-directory: api
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/api-tests.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### API test output'; echo; echo '```'; tail -n 300 "$RUNNER_TEMP/api-tests.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Paste the failing tests on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### ❌ API tests failed on \`${GITHUB_SHA:0:7}\`"
            echo
            echo '```text'
            grep -E "not ok|# (tests|pass|fail)|AssertionError|error:" "$RUNNER_TEMP/api-tests.log" | tail -n 60
            echo '```'
          } > "$RUNNER_TEMP/api-tests-comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/api-tests-comment.md"

  backup-drill:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the same guarantee the PRD asks for in one place: a dump that has never
    # been restored is only a file, so every push proves it rebuilds the schema
    # and the row counts the backup recorded
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jetino
          POSTGRES_USER: jetino
          POSTGRES_PASSWORD: jetino_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetino -d jetino"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jetino:jetino_ci_only@localhost:5432/jetino?schema=public
      DRILL_DATABASE_URL: postgresql://jetino:jetino_ci_only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Keep backups out of the repository
        # the runner context is not available in job-level env, so the scratch
        # directory is exported for the rest of the job instead
        run: echo "BACKUP_DIR=$RUNNER_TEMP/jetino-backups" >> "$GITHUB_ENV"
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Build a database worth backing up
        working-directory: api
        run: |
          npm run db:migrate
          npm run db:seed:demo
      - name: Install PostgreSQL client tools
        working-directory: api
        run: command -v pg_dump >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
      - name: Back up
        working-directory: api
        run: npm run db:backup
      - name: Restore the backup into a scratch database and compare
        working-directory: api
        run: npm run db:restore-drill
      - name: Show the backup listing when the drill fails
        if: failure()
        run: ls -l "$BACKUP_DIR" && tail -n 40 "$BACKUP_DIR"/*.rows 2>/dev/null || true
